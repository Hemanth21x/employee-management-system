# Server
server.port=9999

# MySQL connection
# Update the username/password below to match your local MySQL setup.
# This assumes a database named "sbdata" already exists (CREATE DATABASE sbdata;)
spring.datasource.url=jdbc:mysql://localhost:3306/sbdata?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# update = creates/alters tables automatically to match your entities (good for learning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
